interface:
  display_name: "seedance2.5提示词设计-v1.0"
  short_description: "编写并接续精修视频提示词，按剧情设计走位与表演，多轮改稿保持精练"
  default_prompt: "使用 $seedance25-prompt-design-v1-0 编写或续改这份 Seedance 2.5 提示词，沿用已定分镜，每镜按戏写出摄影机运动与落幅，固定须有表达需要，素材用短句绑定，镜内优先点名，从观众视角定位实际入画的元素，写出有前情、有回应的人物表演。"

policy:
  allow_implicit_invocation: true
